[package]
name = "finance-core"
version = "0.1.0"
edition = "2021"
description = "财富自由规划工具的计算核心（Rust -> WASM）"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
rand = "0.8"
rand_distr = "0.4"
rust_finprim = { version = "0.5.1", features = ["rust_decimal"] }

# 已知前提：蒙特卡洛随机数（rand/getrandom）在 wasm32 目标上需要 "js" feature
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
