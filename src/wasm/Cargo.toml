[package]
name = "finance-core"
version = "0.1.0"
edition = "2021"
description = "财富自由规划工具的计算核心（Rust -> WASM）"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
# arbitrary_precision：JSON 数字按字面量字符串精确解析/序列化，配合
# rust_decimal::serde::arbitrary_precision 实现金额的精确进出（无 f64 中转）
serde_json = { version = "1", features = ["arbitrary_precision"] }
rust_decimal = { version = "1", features = ["serde", "serde-with-arbitrary-precision"] }
rand = "0.8"
rand_distr = "0.4"
rust_finprim = { version = "0.5.1", features = ["rust_decimal"] }

# 已知前提：蒙特卡洛随机数（rand/getrandom）在 wasm32 目标上需要 "js" feature
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# 发布构建瘦身（尺寸门禁：dist 全量 ≤ 2,000,000 bytes）：
# - opt-level = "z"：按体积优先优化（金融计算量级毫秒级，速度换体积划算）；
# - lto + codegen-units = 1：跨 crate 消除死代码（依赖库未用到的金融原语等）；
# - panic = "abort"：wasm32 无 unwind 机制，wasm-bindgen 官方推荐口径；
# - strip = true：剥掉符号名与调试类自定义段（安全前提见下方 wasm-opt = false 注释）。
# 仅影响发布产物，不影响 cargo test 的 dev/test 档。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 跳过 wasm-pack 自带的 wasm-opt 后处理步骤（文档支持的官方配置项）。
# 原因：wasm-pack 0.13.1 附带的 wasm-opt（binaryen v117）默认特性集不含
# bulk-memory / 非陷阱浮点转整（trunc_sat），而当前 rustc 已默认按这些
# 特性出码，wasm-opt 校验直接报 "error validating input"
# 导致整个 wasm-pack 构建失败（2026-11-23 WF-04 回收轮再实测复现）。
# 关闭后产物为 rustc 全量 LTO + opt-level="z" 的直接输出；浏览器侧
# bulk-memory / trunc_sat 特性均已支持多年。也因此 strip = true 才安全——
# 不再有依赖 target_features 自定义段的后处理校验步骤。
# WF-04 尺寸回收（工作流裁决 C 登记，详见 docs/wf04-spec.md §5.3）：元数据路线
# 保持 false（置 true 实证构建失败），正典回收 = 同一 binaryen 二进制手动后处理，
# 显式补特性允许标志（行为等价由 cargo test + check:lifecycle 等验证网兜底）：
#   wasm-opt.exe src/wasm/pkg/finance_core_bg.wasm -o src/wasm/pkg/finance_core_bg.wasm \
#     -O --enable-bulk-memory --enable-nontrapping-float-to-int
# （387,792 → 356,983 B，-30,809 B；glue JS / d.ts 不受影响；二进制路径
#   %LOCALAPPDATA%/.wasm-pack/wasm-opt-cdcb9e877b68d02e/bin/）
# 上述命令已固化为 npm run build 链内 vite build 之前的固定步骤
# （scripts/optimize-wasm.mjs，pkg 不入库、wasm-pack 重建即丢手动后处理，
# 2026-11-23 门禁修复轮实证复发后接线）；找不到二进制时告警放行，
# 尺寸门禁仍按硬线执法。
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
